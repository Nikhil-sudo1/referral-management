# TeamLease EdTech Referral Portal - Frontend Build Specification
# AWS CodeBuild buildspec for frontend deployment to S3 + CloudFront
version: 0.2

env:
  variables:
    NODE_ENV: "production"
    AWS_DEFAULT_REGION: "ap-south-1"
  parameter-store:
    S3_BUCKET: "/referral/prod/s3-bucket"
    CLOUDFRONT_DIST_ID: "/referral/prod/cloudfront-dist-id"
    VITE_API_URL: "/referral/prod/api-url"

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "=== Install phase started ==="
      - cd frontend
      - npm ci
      - echo "Dependencies installed successfully"

  pre_build:
    commands:
      - echo "=== Pre-build phase started ==="
      - echo "Creating .env file..."
      - echo "VITE_API_URL=$VITE_API_URL" > .env
      - echo "VITE_APP_NAME=TeamLease EdTech Referral Portal" >> .env
      - echo "VITE_APP_VERSION=1.0.0" >> .env
      - cat .env

  build:
    commands:
      - echo "=== Build phase started on $(date) ==="
      - npm run build
      - echo "Frontend build completed successfully"
      - ls -la dist/

  post_build:
    commands:
      - echo "=== Post-build phase started on $(date) ==="
      - echo "Deploying to S3..."
      - aws s3 sync dist/ s3://$S3_BUCKET --delete --cache-control "max-age=31536000,public" --exclude "index.html" --exclude "*.json"
      - aws s3 cp dist/index.html s3://$S3_BUCKET/index.html --cache-control "no-cache,no-store,must-revalidate"
      - echo "Invalidating CloudFront cache..."
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID --paths "/*"
      - echo "=== Frontend deployment completed successfully ==="

artifacts:
  files:
    - frontend/dist/**/*
  base-directory: frontend
  discard-paths: no

cache:
  paths:
    - 'frontend/node_modules/**/*'

