<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
        }
        h1 { color: #4ade80; }
        button {
            background: #4ade80;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover { background: #22c55e; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #333;
        }
        .success { border-left: 4px solid #4ade80; }
        .error { border-left: 4px solid #ef4444; }
        .info { border-left: 4px solid #3b82f6; }
        pre {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Login Test Tool</h1>
        <p>This will test if your backend login is working correctly.</p>
        
        <div>
            <button onclick="testBackendHealth()">1. Test Backend Health</button>
            <button onclick="testAdminLogin()">2. Test Admin Login</button>
            <button onclick="testReferrerLogin()">3. Test Referrer Login</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const resultDiv = document.getElementById('result');

        function showResult(type, title, message, data = null) {
            let html = `<div class="result ${type}">
                <h3>${title}</h3>
                <p>${message}</p>`;
            
            if (data) {
                html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            
            html += '</div>';
            resultDiv.innerHTML = html;
        }

        async function testBackendHealth() {
            try {
                showResult('info', '⏳ Testing...', 'Checking backend health...');
                
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    showResult('success', '✅ Backend is Healthy!', 
                        `Status: ${data.status}<br>Database: ${data.checks.database}`, data);
                } else {
                    showResult('error', '❌ Backend Error', 
                        `Status: ${response.status}`, data);
                }
            } catch (error) {
                showResult('error', '❌ Connection Failed', 
                    `Cannot connect to backend at ${API_URL}<br>Error: ${error.message}`);
            }
        }

        async function testAdminLogin() {
            try {
                showResult('info', '⏳ Testing...', 'Attempting admin login...');
                
                const response = await fetch(`${API_URL}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@teamlease.com',
                        password: 'Password123!'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showResult('success', '✅ Admin Login Successful!', 
                        `Welcome ${data.data.user.name}!<br>Role: ${data.data.user.role}<br>Token received: Yes`, 
                        { user: data.data.user, token: data.data.access_token.substring(0, 50) + '...' });
                } else {
                    showResult('error', '❌ Login Failed', 
                        data.message || 'Invalid credentials', data);
                }
            } catch (error) {
                showResult('error', '❌ Request Failed', 
                    `Error: ${error.message}`);
            }
        }

        async function testReferrerLogin() {
            try {
                showResult('info', '⏳ Testing...', 'Attempting referrer login...');
                
                const response = await fetch(`${API_URL}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'arjun.mehta@gmail.com',
                        password: 'Password123!'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showResult('success', '✅ Referrer Login Successful!', 
                        `Welcome ${data.data.user.name}!<br>Role: ${data.data.user.role}<br>Token received: Yes`, 
                        { user: data.data.user, token: data.data.access_token.substring(0, 50) + '...' });
                } else {
                    showResult('error', '❌ Login Failed', 
                        data.message || 'Invalid credentials', data);
                }
            } catch (error) {
                showResult('error', '❌ Request Failed', 
                    `Error: ${error.message}`);
            }
        }

        // Auto-test on load
        window.onload = () => {
            showResult('info', '👋 Welcome!', 
                'Click the buttons above to test your backend login functionality.<br><br>' +
                'Make sure your backend is running on http://localhost:8000');
        };
    </script>
</body>
</html>
