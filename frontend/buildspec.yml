# TeamLease EdTech Referral Portal - UI Build Specification
# AWS CodeBuild buildspec for UI deployment to ECS Fargate
# Runs on port 3001
version: 0.2

env:
  variables:
    AWS_REGION: "ap-south-1"
    AWS_ACCOUNT_ID: "163742846785"
    ECR_REPO: "dev-referral-mgmt-ui-ecr"
    ECS_CLUSTER: "hackathon"
    ECS_SERVICE: "dev-referral-mgmt-ui-service"
    CONTAINER_NAME: "dev-referral-mgmt-ui-container"
  parameter-store:
    VITE_API_URL: "/referral/dev/api-url"

phases:
  pre_build:
    commands:
      - echo "=== Pre-build phase started on $(date) ==="
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Repository URI - $REPOSITORY_URI"
      - echo "Image tag - $IMAGE_TAG"
      - echo "API URL - $VITE_API_URL"

  build:
    commands:
      - echo "=== Build phase started on $(date) ==="
      - echo "Changing to frontend directory..."
      - cd frontend
      - pwd
      - echo "Building the Docker image..."
      - |
        docker build \
          --build-arg VITE_API_URL=$VITE_API_URL \
          --tag $REPOSITORY_URI:latest \
          --tag $REPOSITORY_URI:$IMAGE_TAG \
          --file Dockerfile \
          .
      - echo "Docker build completed successfully"

  post_build:
    commands:
      - echo "=== Post-build phase started on $(date) ==="
      - echo "Pushing Docker images to ECR..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Writing image definitions file..."
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json
      - echo "=== Build completed successfully on $(date) ==="

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes

cache:
  paths:
    - 'node_modules/**/*'

