server {
    listen 3001 default_server;
    listen [::]:3001 default_server;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React + Vite SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ALB health check
    location /health {
        return 200 "OK";
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
