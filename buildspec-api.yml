# TeamLease EdTech Referral Portal - API Build Specification
# AWS CodeBuild buildspec for API deployment to ECS Fargate
version: 0.2

env:
  variables:
    AWS_REGION: "ap-south-1"
    AWS_ACCOUNT_ID: "163742846785"
    ECR_REPO: "dev-referral-mgmt-api-ecr"
    ECS_CLUSTER: "hackathon"
    ECS_SERVICE: "dev-referral-mgmt-apii-service"
    CONTAINER_NAME: "dev-referral-mgmt-api"

phases:
  pre_build:
    commands:
      - echo "=== Pre-build phase started ==="
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Repository URI:" $REPOSITORY_URI
      - echo "Image tag:" $IMAGE_TAG

  build:
    commands:
      - echo "=== Build phase started on $(date) ==="
      - echo "Building the Docker image..."
      - docker build -t $REPOSITORY_URI:latest -f Dockerfile.api .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
      - echo "Docker build completed successfully"

  post_build:
    commands:
      - echo "=== Post-build phase started on $(date) ==="
      - echo "Pushing Docker images to ECR..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Writing image definitions file..."
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json
      - echo "=== Build completed successfully ==="

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes

